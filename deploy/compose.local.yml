# Development only. The parity test compares this with the production service definitions.
# Plain YAML avoids custom tags that the repository's YAML guard rejects.
name: ${LOCAL_PROJECT:?run make local-init}

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:18660:80"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    security_opt:
      - no-new-privileges:true

  backend:
    image: ${BACKEND_IMAGE:?run make local-init}
    build: ../backend
    restart: unless-stopped
    env_file: ../.cache/local-stack/runtime.env
    environment:
      ENVIRONMENT: development
      TRUST_X_FORWARDED_FOR: "true"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import sys,urllib.request; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/health",timeout=3).status==200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  migrate:
    image: ${BACKEND_IMAGE:?run make local-init}
    build: ../backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    env_file: ../.cache/local-stack/runtime.env
    environment:
      ENVIRONMENT: development
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run make local-init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make local-init}
      POSTGRES_DB: ${POSTGRES_DB:?run make local-init}
    ports:
      - "127.0.0.1:18662:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:18663:6379"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  worker:
    image: ${BACKEND_IMAGE:?run make local-init}
    build: ../backend
    command: ["python", "-m", "accord.command.worker"]
    restart: unless-stopped
    env_file: ../.cache/local-stack/runtime.env
    environment:
      ENVIRONMENT: development
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:?run make local-init}
    build: ../frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /app/.next/cache
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
  pgdata:
