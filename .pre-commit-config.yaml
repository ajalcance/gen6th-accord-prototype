# Pre-commit hooks — catch problems BEFORE they enter a commit.
# Setup (once):  pip install pre-commit && pre-commit install
# Run manually:  pre-commit run --all-files
#
# Secret scanning and hygiene run from day one. Add ruff/black/mypy and JS hooks
# as the corresponding code grows (or rely on `make check` + CI).
#
# Every `rev:` is a full COMMIT SHA with the tag in a comment. A tag can be moved to point at
# different code; a commit cannot (ADR-0018). `pre-commit autoupdate --freeze` keeps this form.
#
# The gitleaks hook scans the STAGED change at commit time. It is skipped in CI, where nothing is
# staged; CI runs scripts/secret_scan.py over commits instead. Its version must match
# GITLEAKS_VERSION in .github/workflows/ci.yml — tests/guards/test_runtime_alignment.py checks.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  # Shell linting as a pre-commit hook rather than a new CI job: it then runs locally on commit
  # AND in the existing `hygiene` job, adding real coverage at zero extra billable minutes (job
  # COUNT is what GitHub charges for). Workflow linting (actionlint) is a CI-only step instead —
  # its pip package builds from source and needs Go, which would break commits for any adopter
  # without a Go toolchain.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 2c9f875913ee60ca25ce70243dc24d5b6415598c # frozen: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key   # blocks committing PEM private keys
      - id: mixed-line-ending
        args: ["--fix=lf"]
