# ==============================================================================
# Release — build ONCE, record the evidence, promote the same bytes
# ==============================================================================
# Two entry points, and they do different things on purpose:
#
#   push of a v* tag  -> guard + candidate. Builds each image once, pushes it to GHCR,
#                        signs it keyless with cosign (GitHub OIDC), generates an SBOM,
#                        and publishes a signed release-evidence.json naming every image
#                        by DIGEST. Nothing is promoted.
#   workflow_dispatch -> promote. Verifies the evidence signature and each image
#                        signature, then points the :stable tag at the SAME digests.
#                        It contains no build step: promotion that rebuilds is not
#                        promotion, it ships bytes nobody reviewed from the same source.
#
# Signing is cosign-only, deliberately. The GitHub Attestations API
# (actions/attest-build-provenance) is not available on every plan/visibility, and
# `deploy/verify.sh` only ever calls `cosign verify` — so an attestation was never
# load-bearing for the deploy gate, it just added a step that could fail the release.
# Builds also set `provenance: false` so each push is a single manifest and the signed
# digest is unambiguously the digest of the image that runs. Provenance therefore lives
# in the evidence document (a signed blob), NOT in an OCI attestation manifest that
# would change what `outputs.digest` refers to. See docs/decisions/0010.
# ==============================================================================

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      promote_tag:
        description: "Release tag to promote to :stable (e.g. v1.2.3)"
        required: true
        type: string
      confirm:
        description: "Type the SAME tag again to confirm — promotion moves what production pulls"
        required: true
        type: string
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  guard:
    name: guard
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read # release-blocker holds
      actions: read # the tagged commit's own CI run on the default branch (preflight check 7)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked]
          fetch-depth: 0
      - name: Refuse a tag that is not an ancestor of the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags --quiet origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "::error title=Unreleasable ref::${GITHUB_REF} points at a commit that is not on \
          ${DEFAULT_BRANCH}. Release tags must be cut from ${DEFAULT_BRANCH}, so that everything \
          shipped has passed PR review, code-owner review and ci-complete. Nothing was signed."
            exit 1
          fi
          echo "✓ ${GITHUB_SHA} is reachable from ${DEFAULT_BRANCH} — safe to build and sign."
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Release preflight (fail-closed)
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 scripts/release_preflight.py \
            --tag "${GITHUB_REF_NAME}" \
            --mode at-tag \
            --base-ref "origin/${DEFAULT_BRANCH}"
  candidate:
    name: candidate
    needs: guard
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # attach evidence + SBOMs to the GitHub Release
      packages: write # push to GHCR
      id-token: write # cosign keyless signing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Registry namespace (GHCR requires lowercase)
        id: ns
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Require genuine scanner packaging and native acceptance
        run: |
          test -f deploy/google/scanner/Dockerfile
          test -f deploy/google/scanner/input-lock.json
          test -f deploy/google/scanner/service.json
          test -f deploy/google/scanner/prepare-context.sh
          test -f deploy/google/scanner/native-acceptance.sh
          bash deploy/google/scanner/prepare-context.sh
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build & push backend
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          tags: |
            ghcr.io/${{ steps.ns.outputs.repo }}-backend:${{ github.ref_name }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign backend (keyless)
        env:
          REPO: ${{ steps.ns.outputs.repo }}
          DIGEST: ${{ steps.backend.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${REPO}-backend@${DIGEST}"
      - name: SBOM for backend
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ steps.ns.outputs.repo }}-backend@${{ steps.backend.outputs.digest }}
          format: spdx-json
          output-file: sbom-backend.spdx.json
          upload-artifact: false
      - name: Detect frontend
        id: fe
        run: |
          if [ -f frontend/Dockerfile ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build & push frontend
        id: frontend
        if: steps.fe.outputs.exists == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false # single manifest, so digest == image (see backend step)
          tags: |
            ghcr.io/${{ steps.ns.outputs.repo }}-frontend:${{ github.ref_name }}
      - name: Sign frontend (keyless)
        if: steps.fe.outputs.exists == 'true'
        env:
          REPO: ${{ steps.ns.outputs.repo }}
          DIGEST: ${{ steps.frontend.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${REPO}-frontend@${DIGEST}"
      - name: SBOM for frontend
        if: steps.fe.outputs.exists == 'true'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ steps.ns.outputs.repo }}-frontend@${{ steps.frontend.outputs.digest }}
          format: spdx-json
          output-file: sbom-frontend.spdx.json
          upload-artifact: false
      - name: Vulnerability scan (backend SBOM)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom-backend.spdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Vulnerability scan (frontend SBOM)
        if: steps.fe.outputs.exists == 'true'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom-frontend.spdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Build & push scanner
        id: scanner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .cache/scanner-context
          file: deploy/google/scanner/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ steps.ns.outputs.repo }}-scanner:${{ github.ref_name }}
      - name: Sign scanner (keyless)
        env:
          REPO: ${{ steps.ns.outputs.repo }}
          DIGEST: ${{ steps.scanner.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${REPO}-scanner@${DIGEST}"
      - name: SBOM for scanner
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ steps.ns.outputs.repo }}-scanner@${{ steps.scanner.outputs.digest }}
          format: spdx-json
          output-file: sbom-scanner.spdx.json
          upload-artifact: false
      - name: Vulnerability scan (scanner SBOM)
        id: scanner_scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom-scanner.spdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: json
      - name: Native acceptance of exact scanner digest
        env:
          REPO: ${{ steps.ns.outputs.repo }}
          DIGEST: ${{ steps.scanner.outputs.digest }}
          SCAN_REPORT: ${{ steps.scanner_scan.outputs.json }}
        run: |
          bash deploy/google/scanner/native-acceptance.sh \
            "ghcr.io/${REPO}-scanner@${DIGEST}" "${GITHUB_REF_NAME}" "${GITHUB_SHA}" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" scanner-artifacts
          cp sbom-scanner.spdx.json scanner-artifacts/sbom-scanner.spdx.json
          test -n "$SCAN_REPORT"
          cp "$SCAN_REPORT" scanner-artifacts/scanner-scan_raw.json
      - name: Production-readiness verdict for the tree being released
        run: python3 scripts/prod_readiness.py --json production-readiness.json
      - name: Build release evidence
        env:
          REPO_NS: ${{ steps.ns.outputs.repo }}
          SCANNER_DIGEST: ${{ steps.scanner.outputs.digest }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          HAS_FRONTEND: ${{ steps.fe.outputs.exists }}
        run: |
          args=(--emit --tag "${GITHUB_REF_NAME}" --commit "${GITHUB_SHA}"
                --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                --image "backend=ghcr.io/${REPO_NS}-backend@${BACKEND_DIGEST}"
                --sbom "backend=sbom-backend.spdx.json"
                --image "scanner=ghcr.io/${REPO_NS}-scanner@${SCANNER_DIGEST}"
                --sbom "scanner=sbom-scanner.spdx.json")
          if [ "$HAS_FRONTEND" = "true" ]; then
            args+=(--image "frontend=ghcr.io/${REPO_NS}-frontend@${FRONTEND_DIGEST}"
                   --sbom "frontend=sbom-frontend.spdx.json")
          fi
          args+=(--production-readiness production-readiness.json)
          python3 scripts/release_evidence.py "${args[@]}" --out release-evidence.json
          python3 scripts/release_evidence.py --validate release-evidence.json \
            --expect-tag "${GITHUB_REF_NAME}" --require-clean
      - name: Bind and verify scanner assembly before publication
        run: |
          python3 scripts/scanner_assembly_emit.py --artifacts scanner-artifacts \
            --release release-evidence.json --out scanner-assembly.json --tag "${GITHUB_REF_NAME}"
          python3 scripts/scanner_assembly_evidence.py --assembly scanner-assembly.json \
            --release release-evidence.json --artifacts scanner-artifacts --tag "${GITHUB_REF_NAME}"
          python3 scripts/scanner_release_gate.py --mode candidate --assembly scanner-assembly.json \
            --release release-evidence.json --artifacts scanner-artifacts --tag "${GITHUB_REF_NAME}"
          cosign sign-blob --yes --bundle scanner-assembly.bundle scanner-assembly.json
      - name: Sign the evidence (keyless)
        run: |
          cosign sign-blob --yes \
            --bundle release-evidence.bundle \
            release-evidence.json
      - name: Publish the release with its evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            release-evidence.json release-evidence.bundle scanner-assembly.json scanner-assembly.bundle \
            scanner-artifacts/scanner-* sbom-*.spdx.json \
            || gh release upload "${GITHUB_REF_NAME}" \
                 release-evidence.json release-evidence.bundle scanner-assembly.json scanner-assembly.bundle \
                 scanner-artifacts/scanner-* sbom-*.spdx.json --clobber
          {
            echo "### Release candidate ${GITHUB_REF_NAME}"
            echo
            echo 'Signed and recorded. Nothing is promoted yet — run this workflow manually,'
            echo 'giving this tag as promote_tag, to point the stable tag at these digests.'
            echo
            echo '~~~json'
            cat release-evidence.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
  promote:
    name: promote
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # retag an existing digest; no build
      id-token: write # cosign verification
    steps:
      - name: Typed confirmation
        env:
          PROMOTE_TAG: ${{ inputs.promote_tag }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$PROMOTE_TAG" != "$CONFIRM" ]; then
            echo "::error title=Not confirmed::confirm ('$CONFIRM') does not match promote_tag \
          ('$PROMOTE_TAG'). Nothing was promoted."
            exit 1
          fi
          echo "✓ confirmed: promoting $PROMOTE_TAG"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Fetch the evidence for this release
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE_TAG: ${{ inputs.promote_tag }}
        run: |
          gh release download "$PROMOTE_TAG" \
            --pattern 'release-evidence.json' --pattern 'release-evidence.bundle' \
            --pattern 'scanner-assembly.json' --pattern 'scanner-assembly.bundle' --clobber
          gh release download "$PROMOTE_TAG" --dir scanner-artifacts \
            --pattern 'scanner-*' --pattern 'sbom-scanner.spdx.json'
      - name: Verify the evidence is signed, well-formed, and for this release
        env:
          PROMOTE_TAG: ${{ inputs.promote_tag }}
        run: |
          cosign verify-blob \
            --bundle release-evidence.bundle \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/v" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            release-evidence.json
          python3 scripts/release_evidence.py --validate release-evidence.json \
            --expect-tag "$PROMOTE_TAG" --require-clean
      - name: Verify mandatory scanner assembly before any retagging
        env:
          PROMOTE_TAG: ${{ inputs.promote_tag }}
        run: |
          python3 scripts/scanner_release_gate.py --mode promote --assembly scanner-assembly.json \
            --release release-evidence.json --artifacts scanner-artifacts --tag "$PROMOTE_TAG"
      - name: Verify signatures and point :stable at the recorded digests
        run: |
          identity="^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/v"
          issuer="https://token.actions.githubusercontent.com"
          python3 scripts/release_evidence.py --list images release-evidence.json > images.txt
          while read -r image; do
            echo "Verifying $image"
            cosign verify "$image" \
              --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer "$issuer" >/dev/null
            repo="${image%@*}"
            docker buildx imagetools create --tag "${repo}:stable" "$image"
            echo "  ✓ ${repo}:stable now points at ${image#*@}"
          done < images.txt
      - name: Report what production should pull
        env:
          PROMOTE_TAG: ${{ inputs.promote_tag }}
        run: |
          {
            echo "### Promoted ${PROMOTE_TAG}"
            echo
            echo 'Set these on the deploy host — by digest, never by tag:'
            echo
            echo '~~~'
            python3 scripts/release_evidence.py --list env release-evidence.json
            echo '~~~'
            echo
            echo 'Then run deploy/verify.sh on the host before bringing the stack up.'
          } >> "$GITHUB_STEP_SUMMARY"
